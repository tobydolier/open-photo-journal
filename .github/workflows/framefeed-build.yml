name: Verify FrameFeed standalone build

on:
  push:
    branches:
      - prepare-framefeed-cloudflare
    paths:
      - 'vite.config.ts'
      - 'scripts/**'
      - 'worker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/framefeed-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build standalone FrameFeed
        run: pnpm run build
        env:
          FRAMEFEED_DEPLOY: '1'
      - name: Validate generated bindings
        run: |
          node --input-type=module <<'EOF'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('dist/server/wrangler.json','utf8'));
          const db=(c.d1_databases||[]).find(x=>x.binding==='DB');
          const r2=(c.r2_buckets||[]).find(x=>x.binding==='BUCKET');
          if(c.name!=='framefeed'||db?.database_id!=='2d43ec6a-9a00-425e-8497-2495a55f2d65'||r2?.bucket_name!=='framefeed-media') throw Error('Wrong generated bindings');
          console.log('FrameFeed Worker bindings verified');
          EOF
