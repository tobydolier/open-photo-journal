name: Promote verified security dependency files
on:
  push:
    branches: [security/phase-one]
    paths: ['.github/workflows/promote-security-candidate.yml']
permissions:
  contents: write
  actions: read
jobs:
  promote:
    if: github.repository == 'tobydolier/open-photo-journal' && github.ref == 'refs/heads/security/phase-one'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/phase-one
      - name: Retrieve exact successful build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api repos/tobydolier/open-photo-journal/actions/artifacts/14166555567/zip > "$RUNNER_TEMP/candidate.zip"
          echo '590e8ae6def1591ae5ccd0e938597aa3462984c4c97ddb5ad9462b3bcf28702c  '"$RUNNER_TEMP/candidate.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile, os, json
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/candidate.zip') as z:
              audit=json.loads(z.read('security-audit.json'))['metadata']['vulnerabilities']
              assert audit['high']==0 and audit['critical']==0
              for name in ('package.json','pnpm-lock.yaml','pnpm-workspace.yaml'):
                  with open(name,'wb') as f: f.write(z.read(name))
          PY
      - name: Commit only the three verified dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          git diff --cached --stat
          git commit -m "Apply dependency files from successful security candidate run 43725615270"
          git push origin HEAD:refs/heads/security/phase-one
